server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    # Evita redirect para URL com a porta interna (80)...
    absolute_redirect off;

    # DNS interno do Docker: re-resolve "api" se o contêiner for recriado...
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API Laravel e cookie CSRF do Sanctum
    location ~ ^/(api|sanctum)/ {
        fastcgi_pass $api_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Redireciona /admin para /admin/
    location = /admin {
        return 301 /admin/;
    }

    # Config SPA do admin, se não existir o arquivo e/ou diretório solicitado,
    # tenta servir o index.html (padrão do React)...
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Config SPA do front, com o mesmo comportamento do admin acima...
    location / {
        try_files $uri $uri/ /index.html;
    }
}