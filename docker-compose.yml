name: lib-control

services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1000
        GID: 1000
    image: lib-control-php
    working_dir: /var/www/html
    environment:
      TZ: America/Bahia
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-lib_control}
      DB_USERNAME: ${DB_USERNAME:-lib_control}
      DB_PASSWORD: ${DB_PASSWORD:-lib_control}
    volumes:
      - ./api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lib_control}
      POSTGRES_USER: ${DB_USERNAME:-lib_control}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lib_control}
      TZ: America/Bahia
    ports:
      - "${DB_PUBLIC_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_APP_PORT:-5000}:80"
    volumes:
      - ./api:/var/www/html:ro
      - ./web:/var/www/web:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
