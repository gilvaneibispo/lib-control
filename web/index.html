<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lib Control</title>

    <link rel="stylesheet" href="css/libs/bootstrap.min.css">
    <link rel="stylesheet" href="css/libs/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container py-5">
            <div class="card">
            <div class="card-body text-center">
                <h1 class="card-title">
                    <i class="bi bi-hand-thumbs-up text-primary"></i>
                    Olá Mundo!!!
                </h1>
                <p id="mensagem" class="card-text text-muted">
                    Clique no botão abaixo.
                </p>
                <button id="conferirBtn" type="button" class="btn btn-primary">
                    <i class="bi bi-emoji-smile"></i>
                    Conferir
                </button>
            </div>
        </div>
    </main>

    <script src="js/libs/jquery.min.js"></script>
    <script src="js/libs/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
